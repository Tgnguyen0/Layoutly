spring.application.name=layoutly-be
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=${LAYOUTLY_AUTH_SECURE_COOKIE:false}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/layoutly}
spring.datasource.username=${DATABASE_USER:layoutly}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
layoutly.migration.legacy-enabled=${LAYOUTLY_IMPORT_LEGACY:false}
layoutly.migration.ownership-file=${LAYOUTLY_LEGACY_OWNERSHIP_FILE:}
layoutly.auth.password-reset-enabled=${LAYOUTLY_PASSWORD_RESET_ENABLED:false}
layoutly.auth.public-url=${LAYOUTLY_PUBLIC_URL:http://localhost:5173}
layoutly.auth.email-from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
# Set true when serving behind HTTPS in production.
layoutly.auth.secure-cookie=${LAYOUTLY_AUTH_SECURE_COOKIE:false}
# Preview/export can include many Figma assets and may legitimately take longer than MVC's default timeout.
spring.mvc.async.request-timeout=5m

# Token cua Figma (Settings > Account > Personal access tokens trong Figma)
figma.api.token=${FIGMA_TOKEN:}
figma.api.base-url=https://api.figma.com/v1
# Gioi han JSON tra ve tu Figma. Cac file lon co the vuot qua muc 20 MB mac dinh truoc day.
figma.api.max-in-memory-size-mb=100
# Serialize real Figma calls to stay within the lowest per-minute Tier 1 budget.
figma.api.min-interval-ms=6500

# Raw file JSON survives backend restarts. Only explicit refresh bypasses this cache.
layoutly.cache.directory=.layoutly-cache

# Persistent snapshots imported from REST or Layoutly Bridge. No token is stored here.
layoutly.data.directory=layoutly-data

# Development origins allowed to upload from the Figma plugin UI and open the local app.
layoutly.bridge.allowed-origins=https://www.figma.com,http://localhost:5173,null
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Snapshot fixtures duoc luu cuc bo de test khong phu thuoc Figma API.
layoutly.fixtures.directory=test-fixtures

# Opt-in measured CSS corrections. Keep legacy renderer until visual gates are reviewed.
layoutly.renderer.css-corrections=${LAYOUTLY_RENDERER_CSS_CORRECTIONS:false}
layoutly.renderer.page-consistency=${LAYOUTLY_RENDERER_PAGE_CONSISTENCY:false}

# In JSON cho de doc khi debug
spring.jackson.serialization.indent-output=true

# Local-only AI. The registry rejects cloud provider overrides in this mode.
layoutly.ai.provider=${LAYOUTLY_AI_PROVIDER:ollama}
layoutly.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
layoutly.ai.ollama.model=${LAYOUTLY_OLLAMA_MODEL:qwen3:4b}
layoutly.ai.ollama.context-window=4096
layoutly.ai.ollama.max-output-tokens=1024
layoutly.ai.ollama.timeout-seconds=120
