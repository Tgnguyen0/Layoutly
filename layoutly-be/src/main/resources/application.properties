spring.application.name=layoutly-be
server.port=8080
# Preview/export can include many Figma assets and may legitimately take longer than MVC's default timeout.
spring.mvc.async.request-timeout=5m

# Token cua Figma (Settings > Account > Personal access tokens trong Figma)
figma.api.token=${FIGMA_TOKEN:}
figma.api.base-url=https://api.figma.com/v1
# Gioi han JSON tra ve tu Figma. Cac file lon co the vuot qua muc 20 MB mac dinh truoc day.
figma.api.max-in-memory-size-mb=100
# Serialize real Figma calls to stay within the lowest per-minute Tier 1 budget.
figma.api.min-interval-ms=6500

# Raw file JSON survives backend restarts. Only explicit refresh bypasses this cache.
layoutly.cache.directory=.layoutly-cache

# Persistent snapshots imported from REST or Layoutly Bridge. No token is stored here.
layoutly.data.directory=layoutly-data

# Development origins allowed to upload from the Figma plugin UI and open the local app.
layoutly.bridge.allowed-origins=https://www.figma.com,http://localhost:5173,null
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Snapshot fixtures duoc luu cuc bo de test khong phu thuoc Figma API.
layoutly.fixtures.directory=test-fixtures

# In JSON cho de doc khi debug
spring.jackson.serialization.indent-output=true
