spring.application.name=layoutly-be
server.port=8080
# Preview/export can include many Figma assets and may legitimately take longer than MVC's default timeout.
spring.mvc.async.request-timeout=5m

# Token cua Figma (Settings > Account > Personal access tokens trong Figma)
figma.api.token=${FIGMA_TOKEN:}
figma.api.base-url=https://api.figma.com/v1
# Gioi han JSON tra ve tu Figma. Cac file lon co the vuot qua muc 20 MB mac dinh truoc day.
figma.api.max-in-memory-size-mb=100
# Serialize real Figma calls to stay within the lowest per-minute Tier 1 budget.
figma.api.min-interval-ms=6500

# Raw file JSON survives backend restarts. Only explicit refresh bypasses this cache.
layoutly.cache.directory=.layoutly-cache

# Persistent snapshots imported from REST or Layoutly Bridge. No token is stored here.
layoutly.data.directory=layoutly-data

# Development origins allowed to upload from the Figma plugin UI and open the local app.
layoutly.bridge.allowed-origins=https://www.figma.com,http://localhost:5173,null
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Snapshot fixtures duoc luu cuc bo de test khong phu thuoc Figma API.
layoutly.fixtures.directory=test-fixtures

# In JSON cho de doc khi debug
spring.jackson.serialization.indent-output=true

# Neon PostgreSQL. Tren Render: dat DB_URL, DB_USER, DB_PASSWORD trong Environment Variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-fancy-poetry-aoa8ybn6.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Neon tu tat compute khi roi: khong giu san ket noi, cho du lau cho lan danh thuc dau.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000

# Phia sau proxy cua Render: lay dung https va IP that cua client (cookie Secure, gioi han dang nhap sai).
server.forward-headers-strategy=native

# Tai khoan / du an
layoutly.auth.bcrypt-strength=10
layoutly.projects.max-per-user=50
# Origin duoc phep goi /api/auth va /api/projects kem cookie (chi can khi frontend o cong khac, vi du Vite 5173).
layoutly.cors.allowed-origins=http://localhost:5173
