<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layoutly Bridge</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; background: var(--figma-color-bg); color: var(--figma-color-text); font-size: 12px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    .subtitle { margin: 5px 0 18px; color: var(--figma-color-text-secondary); line-height: 1.45; }
    .panel { border: 1px solid var(--figma-color-border); border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    .label { display: block; margin-bottom: 7px; font-weight: 650; }
    .selection { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; }
    .selection strong { overflow-wrap: anywhere; }
    .muted { color: var(--figma-color-text-secondary); }
    label.option { display: flex; align-items: flex-start; gap: 8px; padding: 7px 0; cursor: pointer; }
    input[type="radio"] { margin-top: 2px; }
    input[type="url"] { width: 100%; height: 34px; border: 1px solid var(--figma-color-border); border-radius: 5px; padding: 0 9px; background: var(--figma-color-bg-secondary); color: var(--figma-color-text); outline: none; }
    input[type="url"]:focus { border-color: var(--figma-color-border-selected); }
    button { width: 100%; height: 38px; border: 0; border-radius: 5px; font: inherit; font-weight: 700; cursor: pointer; }
    button.primary { background: #1769ff; color: white; }
    button.secondary { margin-top: 8px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg-secondary); color: var(--figma-color-text); }
    button:disabled { cursor: wait; opacity: .6; }
    .progress { display: none; margin-top: 14px; }
    .progress.visible { display: block; }
    .track { height: 5px; overflow: hidden; border-radius: 3px; background: var(--figma-color-bg-secondary); }
    .bar { width: 0; height: 100%; background: #1769ff; transition: width .2s ease; }
    .progress-row { display: flex; justify-content: space-between; margin-top: 7px; color: var(--figma-color-text-secondary); }
    .message { display: none; margin-top: 12px; border-radius: 5px; padding: 10px; line-height: 1.45; overflow-wrap: anywhere; }
    .message.error { display: block; border: 1px solid #ef4444; color: #ef4444; }
    .message.success { display: block; border: 1px solid #10b981; color: #059669; }
  </style>
</head>
<body>
  <h1>Layoutly Bridge</h1>
  <p class="subtitle">Sync the selected design directly to Layoutly. No Personal Access Token is required.</p>

  <section class="panel">
    <span class="label">Current selection</span>
    <div class="selection">
      <strong id="node-name">No node selected</strong><span id="node-type" class="muted">-</span>
      <span id="node-id" class="muted">-</span><span id="node-count" class="muted">0 nodes</span>
    </div>
  </section>

  <section class="panel">
    <span class="label">Export scope</span>
    <label class="option">
      <input type="radio" name="scope" value="SELECTION" checked>
      <span><strong>Selected Frame / Selected Node</strong><br><span class="muted">Recommended for focused, fast imports.</span></span>
    </label>
    <label class="option">
      <input type="radio" name="scope" value="PAGE">
      <span><strong>Current Page</strong><br><span id="page-details" class="muted">Export the current page.</span></span>
    </label>
  </section>

  <label class="label" for="backend-url">Backend URL</label>
  <input id="backend-url" type="url" value="http://localhost:8080" spellcheck="false">
  <button id="sync" class="primary" type="button" style="margin-top: 14px">Sync to Layoutly</button>

  <div id="progress" class="progress" aria-live="polite">
    <div class="track"><div id="bar" class="bar"></div></div>
    <div class="progress-row"><span id="progress-label">Ready</span><span id="progress-step">0 / 5</span></div>
  </div>
  <div id="message" class="message"></div>
  <button id="open" class="secondary" type="button" hidden>Open Layoutly</button>

  <script>
    const syncButton = document.getElementById('sync')
    const openButton = document.getElementById('open')
    const progress = document.getElementById('progress')
    const bar = document.getElementById('bar')
    const progressLabel = document.getElementById('progress-label')
    const progressStep = document.getElementById('progress-step')
    const message = document.getElementById('message')
    let openUrl = ''

    syncButton.addEventListener('click', () => {
      const scope = document.querySelector('input[name="scope"]:checked').value
      const backendUrl = document.getElementById('backend-url').value
      syncButton.disabled = true
      openButton.hidden = true
      message.className = 'message'
      setProgress('Reading design', 1)
      parent.postMessage({ pluginMessage: { type: 'sync', scope, backendUrl } }, '*')
    })

    openButton.addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'open-layoutly', url: openUrl } }, '*')
    })

    window.onmessage = async (event) => {
      const data = event.data.pluginMessage
      if (!data) return
      if (data.type === 'selection') {
        const selection = data.selection
        document.getElementById('node-name').textContent = selection?.name || 'No node selected'
        document.getElementById('node-type').textContent = selection?.nodeType || '-'
        document.getElementById('node-id').textContent = selection?.id || '-'
        document.getElementById('node-count').textContent = `${selection?.approximateNodeCount || 0} nodes`
        document.getElementById('page-details').textContent = `${data.page.name} - about ${data.page.approximateNodeCount} nodes`
      }
      if (data.type === 'progress') setProgress(data.label, data.step)
      if (data.type === 'asset-progress') {
        progressLabel.textContent = `Exporting assets ${data.current} / ${data.total}`
      }
      if (data.type === 'error') fail(data.message)
      if (data.type === 'upload') await upload(data)
    }

    async function upload(data) {
      try {
        setProgress('Uploading to Layoutly', 4)
        const form = new FormData()
        form.append('metadata', new Blob([JSON.stringify(data.metadata)], { type: 'application/json' }), 'metadata.json')
        form.append('designJson', new Blob([data.designJson], { type: 'application/json' }), 'design.json')
        if (data.referenceImage) {
          form.append('referenceImage', new Blob([data.referenceImage], { type: 'image/png' }), 'reference.png')
        }
        for (const asset of data.assets) {
          form.append('assets', new Blob([asset.bytes], { type: asset.contentType }), asset.fileName)
        }

        const response = await fetch(`${data.backendUrl}/api/bridge/import`, { method: 'POST', body: form })
        const body = await response.json().catch(() => ({}))
        if (!response.ok) throw new Error(body.error || body.message || `Backend returned HTTP ${response.status}`)

        setProgress('Complete', 5)
        const backend = new URL(data.backendUrl)
        const frontendOrigin = ['localhost', '127.0.0.1'].includes(backend.hostname)
          ? `http://${backend.hostname}:5173`
          : backend.origin
        openUrl = `${frontendOrigin}/?snapshotId=${encodeURIComponent(body.snapshotId)}`
        message.className = 'message success'
        message.textContent = `Snapshot ID: ${body.snapshotId}`
        openButton.hidden = false
        syncButton.disabled = false
      } catch (error) {
        fail(error instanceof Error ? error.message : String(error))
      }
    }

    function setProgress(label, step) {
      progress.classList.add('visible')
      progressLabel.textContent = label
      progressStep.textContent = `${step} / 5`
      bar.style.width = `${step * 20}%`
    }

    function fail(text) {
      syncButton.disabled = false
      message.className = 'message error'
      message.textContent = text
    }
  </script>
</body>
</html>
